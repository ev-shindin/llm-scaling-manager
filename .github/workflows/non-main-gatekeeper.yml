name: Non-Main Gatekeeper
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# The reusable workflow adds one label, which is the issues API; the same pair
# prow-pr-remove-lgtm.yml declares for the same kind of action.
permissions:
  issues: write
  pull-requests: write

jobs:
  gatekeeper:
    # Same-repo branches only, for the reason in prow-pr-remove-lgtm.yml: this
    # one adds `do-not-merge/hold` to a PR whose base is not main, and a fork's
    # GITHUB_TOKEN cannot write labels on the `pull_request` event. The hold is
    # advisory anyway — the base-branch rule it enforces is unchanged, and a
    # same-repo PR still gets held. A release-MAJOR.MINOR branch is a patch
    # line, not a stacked PR, so a PR to one is not held.
    if: github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.base_ref, 'release-')
    uses: llm-d/llm-d-infra/.github/workflows/reusable-non-main-gatekeeper.yaml@49a41ad0160a60f8838f541173ecc4ff87bc2632 # main as of 2026-10-12
