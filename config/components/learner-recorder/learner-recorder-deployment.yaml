apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
spec:
  template:
    spec:
      containers:
      - name: manager
        env:
        - name: LEARNER_RECORDING_DIR
          value: /var/lib/wva/learner-recordings
        volumeMounts:
        - name: learner-recordings
          mountPath: /var/lib/wva/learner-recordings
      # Holds the volume open for `kubectl cp`, which needs tar in the
      # container it copies from. Reads only.
      - name: recordings
        image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
        command: ["sh", "-c", "trap 'exit 0' TERM; while true; do sleep 3600 & wait $!; done"]
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 1m
            memory: 8Mi
          limits:
            memory: 32Mi
        volumeMounts:
        - name: learner-recordings
          mountPath: /var/lib/wva/learner-recordings
          readOnly: true
      volumes:
      - name: learner-recordings
        emptyDir:
          sizeLimit: 600Mi
