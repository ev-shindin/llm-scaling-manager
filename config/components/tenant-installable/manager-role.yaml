---
# The controller's permissions as a NAMESPACED Role.
#
# This is manager-clusterrole.yaml with the cluster-scoped resources removed, and
# what remains is almost all of it — because almost everything WVA reads is
# namespaced. Only three rules could not come along:
#
#   nodes, nodes/status   physical GPU discovery. Needed ONLY by the
#                         gpu-inventory limiter, so an install without one does
#                         not miss them. This is why tenant mode requires
#                         WVA_LIMITER=none or quota.
#   namespaces            listing namespaces to find namespace-local config, and
#                         reading a policy annotation. Both are best-effort: a
#                         single-namespace controller never lists. The policy
#                         read (get) comes from components/policy-namespace-reader,
#                         applied by the prereqs phase; denied, the controller
#                         runs on its own ConfigMap and reports it unverified.
#   clusterqueues,        Kueue quotas. Needed ONLY by a quota entry with
#   resourceflavors,      `kueue.enabled`; components/kueue-reader grants them,
#   cohorts               applied by the prereqs phase like node-reader. The
#                         namespaced half, localqueues and workloads, is below;
#                         cohort borrowing reads both in every namespace,
#                         which the installer grants as its own ClusterRole
#                         only when a policy counts borrowing
#                         (pl_grant_kueue_borrow_read).
#   leases, and the       in the KUEUE namespace, read by name for Kueue
#   kueue-controller-     borrowing (liveness and version): a Role there that
#   manager Deployment    the prereqs phase creates
#                         (pl_grant_kueue_controller_read). Denied, borrowing
#                         freezes as kueue-controller-down.
#
# Everything else — pods, services, configmaps, deployments, replicasets,
# statefulsets, deployments/scale, jobs, resourcequotas, inferencepools,
# scaledobjects, horizontalpodautoscalers, leaderworkersets, servicemonitors,
# events — is namespaced and works identically through a Role. The grant is
# read-only apart from Events, Pods and ScaledObjects: KEDA performs the scaling
# actuation, so WVA writes nothing to reach a replica count, but lending a warm
# Pod is WVA's own action and needs patch on pods, and re-wiring a ScaledObject
# KEDA left without the scaler's metric needs patch on scaledobjects.
#
# This file is maintained BY HAND while manager-clusterrole.yaml is GENERATED
# from kubebuilder markers, so it does not move when the controller gains a
# permission. It already failed to: pods gained patch for the warm pool and this
# copy did not, which disabled the pool on every namespace-scoped install.
# hack/check-tenant-role.py now fails when the two diverge.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - services
  verbs:
  - get
  - list
  - watch
# Pods are the one exception to the read-only grant above, and the exception is
# the warm pool: lending a Pod means patching it into a model's InferencePool
# and taking it back out. Without `patch` the controller starts, sees it could
# never complete a borrow, and disables the pool -- correctly, but after the
# pool has been created and is already holding its accelerators.
#
# This is the one rule the generated ClusterRole does NOT carry: there, a
# cluster-wide patch on pods reached every Pod in the cluster, so the cluster-
# scoped install gets it per namespace from role/wva-pod-writer instead
# (deploy/lib/pod_writer.sh). Here it is namespaced already.
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - ""
  resources:
  - resourcequotas
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - configmaps/status
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - get
  - list
  - patch
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  - statefulsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments/scale
  verbs:
  - get
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
- apiGroups:
  - inference.networking.k8s.io
  - inference.networking.x-k8s.io
  resources:
  - inferencepools
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
- apiGroups:
  - keda.sh
  resources:
  - scaledobjects
  verbs:
  - get
  - patch
- apiGroups:
  - kueue.x-k8s.io
  resources:
  - localqueues
  verbs:
  - get
  - list
# Workloads are read through an informer (the borrowing managed check, the
# preemption check, the lender-waiting signal), so they need watch. Denied,
# the reads fall back to a list and borrowing is withheld where they fail.
- apiGroups:
  - kueue.x-k8s.io
  resources:
  - workloads
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - leaderworkerset.x-k8s.io
  resources:
  - leaderworkersets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - leaderworkerset.x-k8s.io
  resources:
  - leaderworkersets/scale
  verbs:
  - get
- apiGroups:
  - monitoring.coreos.com
  resources:
  - servicemonitors
  verbs:
  - get
  - list
  - watch
