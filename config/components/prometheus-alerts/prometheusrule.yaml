apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: controller-manager-alerts
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: workload-variant-autoscaler
    release: kube-prometheus-stack
spec:
  groups:
  - name: wva.rules
    rules:
    - alert: WVAHighErrorRate
      expr: sum by (component, error_type) (rate(wva_errors_total[5m])) > 0.1
      for: 5m
      labels:
        severity: warning
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/monitoring.md#the-logs"
        summary: "llm-scaling-manager error rate elevated in {{ $labels.component }}"
        description: "Controller component '{{ $labels.component }}' error_type '{{ $labels.error_type }}' rate is {{ $value | printf \"%.2f\" }}/sec (>6/min threshold) sustained for 5+ minutes. Check controller logs for error patterns."

    - alert: WVAOptimizationLoopStalled
      expr: max_over_time(wva_models_processed[10m]) == 0 or absent_over_time(wva_models_processed[10m])
      for: 15m
      labels:
        severity: info
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#the-controller-is-not-ready-or-crash-looping"
        summary: "llm-scaling-manager has processed zero models for 15+ minutes"
        description: "wva_models_processed has been 0 (or absent) over a 10-minute window, sustained for 15+ minutes. This is EXPECTED when no variants are being managed (an idle controller). If you do have managed workloads, it can indicate the optimization loop is stalled/crashed or metric collection is failing — check controller pod status and logs, and Prometheus connectivity."

    - alert: WVAMetricsCollectionFailing
      expr: sum by (query_type, reason) (rate(wva_metrics_collection_errors_total[5m])) > 0.0833
      for: 5m
      labels:
        severity: warning
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#metrics-stale-or-missing"
        summary: "llm-scaling-manager metrics collection failing for {{ $labels.query_type }}"
        description: "Metrics collection query_type '{{ $labels.query_type }}' failing with reason '{{ $labels.reason }}' at {{ $value | printf \"%.2f\" }}/sec (>5/min threshold) sustained for 5+ minutes. Scaling decisions may be based on stale data. Verify Prometheus/metrics endpoint connectivity."

    - alert: WVALearnedStateSnapshotFailing
      expr: sum by (namespace, operation) (increase(wva_learned_state_snapshot_errors_total[15m])) > 0
      for: 15m
      labels:
        severity: warning
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#capacity-priced-high-after-a-restart"
        summary: "llm-scaling-manager in {{ $labels.namespace }} cannot {{ $labels.operation }} its learned-state snapshot"
        description: "The learned-state snapshot (LEARNED_STATE_SNAPSHOT) has failed to {{ $labels.operation }} for 15 minutes. The controller logs the failure once, so this counter is the lasting signal. write: typically Forbidden -- the Role wva-learned-state-role or its binding is missing; the snapshot is still read, but nothing learned since is kept, and the next restart restores it as it was when writing stopped. Have an admin re-run 'NAMESPACE=<ns> make setup-prereqs'. read: an API server or network error, or an edited wva-manager-role; nothing is written until a read succeeds."

    - alert: WVAPolicyNamespaceUnverified
      expr: max by (namespace) (wva_policy_namespace_unverified) == 1
      for: 10m
      labels:
        severity: warning
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#cluster-policy-is-not-applied-policy-namespace-unverified"
        summary: "llm-scaling-manager in {{ $labels.namespace }} cannot see the cluster policy namespace"
        description: "The controller in {{ $labels.namespace }} was denied get on the Namespaces that decide where its limiters and quotas come from (the wva-policy namespace, or a wva.llmd.ai/policy-namespace label), so it runs on its own ConfigMap. A cluster policy an admin published is NOT applied to it, and it may be scaling under a weaker bound than the admin believes is in force. Grouped by namespace, not exported_namespace: this is a controller-level gauge with no model namespace, so the scrape's namespace label is the controller's own. Fix: have a cluster admin re-run 'NAMESPACE=<ns> make setup-prereqs', which grants the Namespace get (components/policy-namespace-reader). The value is set once at startup, so restart the controller after the grant."

    - alert: WVANodeAccessDenied
      expr: wva_node_access_denied == 1
      for: 2m
      labels:
        severity: critical
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#the-controller-is-not-ready-or-crash-looping"
        summary: "llm-scaling-manager has a GPU limiter configured but cannot read nodes"
        description: "A gpu-inventory limiter is declared ALONE in the scaling-policy ConfigMap, and this controller's ServiceAccount is denied list on nodes. Every variant is therefore charged to no accelerator pool, receives no GPU budget, and HAS STOPPED SCALING UP — with no other error, because an unresolved accelerator is a normal state when no limiter is configured. This usually follows an admin adding a limiters: entry to a controller that was installed without node permission. Either grant the node read to the controller's ServiceAccount, or remove the limiters: entry. A gpu-inventory entry beside a quota does not raise this: the quota still bounds, and WVAConstraintProviderSkipped reports the skipped physical limiter instead."

    - alert: WVAConstraintProviderSkipped
      expr: wva_constraint_provider_skipped == 1
      for: 10m
      labels:
        severity: warning
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#gpus-held-or-quota-spent"
        summary: "llm-scaling-manager is deciding without the {{ $labels.provider }} limiter ({{ $labels.reason }})"
        description: "The declared limiter {{ $labels.provider }} has been left out of scaling decisions for 10 minutes, reason {{ $labels.reason }}. The other declared limiters still bound every decision, so models keep scaling, but nothing checks what this one would deny. node_read_denied: gpu-inventory is declared beside a quota and this controller may not list nodes; a cluster admin grants it with 'make setup-prereqs', or remove gpu-inventory from the limiters: list. failed: the controller log line 'GPU constraint provider skipped' says why (a Kueue read or a node list failed). unobserved: its GPU usage has not been observed yet. no_constraints: it returned none."

    - alert: WVAGPUResourceExhausted
      expr: wva_available_gpus == 0
      for: 5m
      labels:
        severity: warning
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#gpus-held-or-quota-spent"
        summary: "GPU-labeled {{ $labels.accelerator_type }} nodes report zero allocatable accelerators"
        description: "The controller sees zero allocatable {{ $labels.accelerator_vendor }} {{ $labels.accelerator_model }} ({{ $labels.accelerator_type }}) GPUs for 5+ minutes. Note: this reflects node *allocatable* capacity (not free/schedulable GPUs), and wva_available_gpus is only emitted when a gpu-inventory limiter is declared in the scaling-policy ConfigMap's limiters: list. A GPU-labeled node advertising zero allocatable accelerators usually means it is NotReady or its device plugin/driver is not installed — check GPU node status and device-plugin pods."

    - alert: WVAReplicaScalingThrashing
      expr: sum by (exported_namespace, variant_name) (rate(wva_replica_scaling_total[10m])) > 0.033
      for: 10m
      labels:
        severity: warning
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#a-model-is-flapping"
        summary: "llm-scaling-manager scaling thrashing detected for {{ $labels.exported_namespace }}/{{ $labels.variant_name }}"
        description: "Variant {{ $labels.exported_namespace }}/{{ $labels.variant_name }} scaling at {{ $value | printf \"%.3f\" }}/sec (>2/min threshold) sustained for 10+ minutes, indicating possible thrashing. Review scaling thresholds and consider adjusting stabilization window or thresholds."

    - alert: WVAModelWillNotScaleToZero
      expr: wva_model_scaling_blocked{reason=~"variant-floor|policy-forbids-zero"} == 1
      for: 15m
      labels:
        severity: info
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/guides/scale-to-zero/README.md#when-a-model-will-not-park"
        summary: "Model {{ $labels.exported_namespace }}/{{ $labels.model_name }} cannot reach zero ({{ $labels.reason }})"
        description: "Half of this model's configuration asks it to park and the other half forbids it, so it never will. reason 'variant-floor': scale-to-zero is enabled, but a variant declares minReplicas > 0 — a model is at zero only when nothing serves it, so that one floor keeps the whole model up and the accelerators are billed indefinitely. reason 'policy-forbids-zero': every variant permits zero, but scale-to-zero is disabled by the model's resolved scaling policy or by a tier one of its variants names, so the bounds are inert; most misleading with a single variant, where minReplicas: 0 reads exactly like a deliberate request to park. The controller log line 'Scale-to-zero is disabled by the scaling policy of a tier' lists the tiers (disabledBy); enable scaleToZero on each, or on the model's per-model entry. Neither is an error and neither breaks serving — which is why nothing else reports them: the model is up and healthy, exactly as every other metric says it should be. Either set every variant's minReplicas to 0, or disable scale-to-zero for the model, so the configuration says what it does."

    - alert: WVAModelHasNoWakeSignal
      expr: (wva_model_scaling_blocked{reason="no-wake-signal"} == 1) unless on (exported_namespace, model_name) (((sum by (exported_namespace, model_name) (wva_model_replicas) == 0) and on (exported_namespace, model_name) label_replace(sum by (namespace, model_name) (rate(llm_d_epp_request_error_total{error_code="ServiceUnavailable",namespace!=""}[5m])) > 0, "exported_namespace", "$1", "namespace", "(.*)")) or ((sum by (exported_namespace, model_name) (wva_model_replicas) == 0) and on (model_name) sum by (model_name) (rate(llm_d_epp_request_error_total{error_code="ServiceUnavailable",namespace=""}[5m])) > 0))
      for: 10m
      labels:
        severity: warning
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#a-model-will-not-wake-from-zero"
        summary: "Model {{ $labels.exported_namespace }}/{{ $labels.model_name }} has no wake signal"
        description: "EPP is exporting no flow-control queue metric at all for this model, so a request arriving while it is parked has nothing that can wake it. This is the ABSENCE of the metric family, not a queue reading zero — an idle queue reports 0 and is healthy. The usual cause is an EPP pod older than the ConfigMap that enabled the flowControl feature gate: EPP reads --config-file once at startup, so enabling the gate does not reach a process already running, and every artifact (image digest, ConfigMap, feature gate, auth) still matches. Check the EPP pod's own startup log for the config it parsed rather than comparing it to the ConfigMap, then restart the EPP deployment. Until this clears, a model that scales to zero will stay there. It stays quiet while the model is parked and EPP refuses its requests: WVAModelParkedWhileRequestsRefused pages for that at critical, so one cause pages once."

# There is deliberately NO alert on reason="engine-unsupported". It means one
# model is served by BOTH vLLM and SGLang, so no single request counter measures
# its idleness and it is never parked (vLLM alone and SGLang alone are each
# supported). That is a standing property of how the model is deployed, not an
# event: it would fire on the day the model is deployed and never clear, and an
# alert that is always firing is one operators learn to route to /dev/null --
# taking the two alerts above with it. The reason is still on the metric and on
# the operational dashboard, which is where a permanent condition belongs.

    # The utilization-share optimizer's conditions that hold until someone
    # changes something. Its passing states (quiet-period, swinging,
    # transfer-limit, ...) clear by themselves and are not alerted on.
    # test/alerts/testdata/utilization-share-alerts.test.yaml pins these.
    - alert: WVAUtilizationShareMarksUnreadable
      expr: max by (exported_namespace, model_name) (wva_model_scaling_blocked{reason="marks-unreadable"}) == 1
      for: 10m
      labels:
        severity: warning
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#the-optimizer-evaluates-but-never-moves-anything"
        summary: "Model {{ $labels.exported_namespace }}/{{ $labels.model_name }} is frozen: the utilization-share optimizer cannot read its transfer marks"
        description: "The controller cannot read the transfer marks on the donor pods of this model's utilization-share group, so it cannot start the group's ledger: every planned model of the group holds what it runs and none scales, up or down. It does not clear by itself. The Error log line 'Utilization share: could not read transfer marks; retrying next cycle' names the cause, typically a missing RBAC grant to list pods in one model's namespace."

    - alert: WVAUtilizationShareFloorsExceedQuota
      expr: max by (exported_namespace, model_name) (wva_model_scaling_blocked{reason="floors-exceed-quota"}) == 1
      for: 15m
      labels:
        severity: warning
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#the-optimizer-evaluates-but-never-moves-anything"
        summary: "The minReplicaCount floors of {{ $labels.exported_namespace }}/{{ $labels.model_name }}'s utilization-share group add up to more than its quota"
        description: "The configured floors (minReplicaCount) of the models sharing this quota add up to more GPUs than the quota holds, so the optimizer cannot honour all of them; every model of the group shows this reason. Lower a floor or raise the quota."

    - alert: WVAUtilizationShareModeInvalid
      expr: max by (namespace, controller_instance) (wva_utilization_share_mode{mode="invalid"}) == 1
      for: 10m
      labels:
        severity: warning
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#the-optimizer-evaluates-but-never-moves-anything"
        summary: "The utilization-share optimizer block does not validate; today's optimizer runs instead"
        description: "The scaling policy's optimizer block failed validation, so the utilization-share optimizer is not running and the fleet is scaled by today's optimizer, silently. The log line 'Utilization share: invalid optimizer block; keeping today's optimizer' says why: a misspelled key, a value out of range, an empty clusterNamespaces entry, or no limiters: list (no budget to share)."

    # The SLO alerts. Notes for whoever edits them; the operator's runbook is
    # in troubleshooting.md.
    # - WVAModelSLOMissed is for the TPOT mean, which promises no share of
    #   requests; TTFT, a percentile, is WVAModelSLOAttainmentLow below.
    # - Counted over judged minutes, never bridged with last_over_time: an
    #   excluded window has no observed series, and on a whole-node model one
    #   exclusion outlasts any range that would be safe. A fixed count of
    #   wall-clock minutes never fires for a fleet that keeps scaling up while
    #   it misses, which is when misses happen.
    # - max by () on each side of every join: a restarted controller's series
    #   overlap the new one's, and a many-to-many join errors at evaluation.
    # - changes(wva_slo_window_requests[5m]) gates on the analyzer still
    #   publishing, so series frozen after it stopped cannot fire.
    # - The replicas gate reads max_over_time over 5m: on a restart or a
    #   leader change the old pod's series go stale at once, and an instant
    #   read is empty until the new leader publishes, which resolved every
    #   firing alert and fired it again. The price: a model that parks while
    #   the alert fires keeps it up for up to those 5 minutes.
    # - test/alerts/testdata/slo-alerts.test.yaml pins each of these.
    - alert: WVAModelSLOMissed
      expr: (count_over_time((max by (exported_namespace, model_name, objective, statistic) (wva_slo_observed_seconds{objective="tpot"}) > on (exported_namespace, model_name, objective, statistic) max by (exported_namespace, model_name, objective, statistic) (wva_slo_target_seconds{objective="tpot"}))[30m:1m]) / on (exported_namespace, model_name, objective, statistic) count_over_time(max by (exported_namespace, model_name, objective, statistic) (wva_slo_observed_seconds{objective="tpot"})[30m:1m]) >= 0.5) and on (exported_namespace, model_name, objective, statistic) count_over_time((max by (exported_namespace, model_name, objective, statistic) (wva_slo_observed_seconds{objective="tpot"}) > on (exported_namespace, model_name, objective, statistic) max by (exported_namespace, model_name, objective, statistic) (wva_slo_target_seconds{objective="tpot"}))[30m:1m]) >= 7 and on (exported_namespace, model_name, objective, statistic) max by (exported_namespace, model_name, objective, statistic) (changes(wva_slo_window_requests[5m])) > 0 and on (exported_namespace, model_name) sum by (exported_namespace, model_name) (max_over_time(wva_model_replicas[5m])) > 0
      for: 2m
      labels:
        severity: warning
        # Observe only on this release: route on this label to a ticket queue
        # rather than a page if a tuning finding should not wake anyone.
        component: slo
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#a-model-misses-or-is-never-judged-against-its-slo"
        summary: "Model {{ $labels.exported_namespace }}/{{ $labels.model_name }} missed its TPOT SLO (mean) in {{ $value | humanizePercentage }} of judged minutes"
        description: "In the last 30 minutes the router-measured TPOT mean was over target in at least half of the judged minutes, and in at least 7: one bad interval of a minute reaches six windows. Minutes around a wake or a starting replica are not judged and count neither way. Only completed requests count, so under shedding the alert can clear while requests fail: read llm_d_epp_request_error_total. On this release the analyzer only observes: the fleet the tier sizes misses the SLO; the autoscaler did not fail. First check the target can be met at all (the runbook says how); if it can, raise the floor or lower scaleUpThreshold. Resolves once judged minutes that meet the target outnumber the misses."

    # TTFT is a percentile, so its SLO is a share of requests: p90 promises 90%
    # within target. The attainment over 30 minutes is request-weighted from the
    # per-minute window readings: each 5-minute window is read five times, in
    # the numerator and the denominator alike, so every request counts equally.
    # Counting miss-minutes instead weighed a minute by the overlap: eight
    # minutes with half the requests late hit 10 of 30 windows and did not
    # fire, while one bad minute hit five and did. Excluded windows have no
    # attainment and count neither way. Three guards:
    # - the judged windows hold at least half the 30 minutes' requests: at p99
    #   a window needs 1000 requests to be judged, so with sparse traffic only
    #   the busy bursts are, and a burst's misses read as the whole half hour;
    # - at least 15 judged minutes: a new series (a percentile change, a fresh
    #   install) otherwise judged the "30 minutes" on the few since it appeared;
    # - it resolves only on a judged recent reading that meets the objective
    #   (unless, not and): an exclusion while a replica starts, which a miss
    #   brings on, resolved the alert, and it fired again once the replica was
    #   Ready.
    - alert: WVAModelSLOAttainmentLow
      expr: (sum_over_time((max by (exported_namespace, model_name, objective, statistic) (wva_slo_window_requests) * on (exported_namespace, model_name, objective, statistic) max by (exported_namespace, model_name, objective, statistic) (wva_slo_attainment_ratio))[30m:1m]) / on (exported_namespace, model_name, objective, statistic) sum_over_time((max by (exported_namespace, model_name, objective, statistic) (wva_slo_window_requests) and on (exported_namespace, model_name, objective, statistic) max by (exported_namespace, model_name, objective, statistic) (wva_slo_attainment_ratio))[30m:1m]) < on (exported_namespace, model_name, objective, statistic) max by (exported_namespace, model_name, objective, statistic) (wva_slo_objective_ratio)) and on (exported_namespace, model_name, objective, statistic) (sum_over_time((max by (exported_namespace, model_name, objective, statistic) (wva_slo_window_requests) and on (exported_namespace, model_name, objective, statistic) max by (exported_namespace, model_name, objective, statistic) (wva_slo_attainment_ratio))[30m:1m]) / on (exported_namespace, model_name, objective, statistic) sum_over_time(max by (exported_namespace, model_name, objective, statistic) (wva_slo_window_requests)[30m:1m]) >= 0.5) and on (exported_namespace, model_name, objective, statistic) count_over_time(max by (exported_namespace, model_name, objective, statistic) (wva_slo_attainment_ratio)[30m:1m]) >= 15 unless on (exported_namespace, model_name, objective, statistic) (sum_over_time((max by (exported_namespace, model_name, objective, statistic) (wva_slo_window_requests) * on (exported_namespace, model_name, objective, statistic) max by (exported_namespace, model_name, objective, statistic) (wva_slo_attainment_ratio))[5m:1m]) / on (exported_namespace, model_name, objective, statistic) sum_over_time((max by (exported_namespace, model_name, objective, statistic) (wva_slo_window_requests) and on (exported_namespace, model_name, objective, statistic) max by (exported_namespace, model_name, objective, statistic) (wva_slo_attainment_ratio))[5m:1m]) >= on (exported_namespace, model_name, objective, statistic) max by (exported_namespace, model_name, objective, statistic) (wva_slo_objective_ratio)) and on (exported_namespace, model_name, objective, statistic) max by (exported_namespace, model_name, objective, statistic) (changes(wva_slo_window_requests[5m])) > 0 and on (exported_namespace, model_name) sum by (exported_namespace, model_name) (max_over_time(wva_model_replicas[5m])) > 0
      for: 2m
      labels:
        severity: warning
        component: slo
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#a-model-misses-or-is-never-judged-against-its-slo"
        summary: "Model {{ $labels.exported_namespace }}/{{ $labels.model_name }} met its {{ $labels.statistic }} TTFT target for only {{ $value | humanizePercentage }} of requests"
        description: "Over the last 30 minutes fewer requests met the router-measured TTFT target than the objective promises (90% for p90), counting every judged request once, with at least 15 judged minutes holding at least half the requests. Windows around a wake or a starting replica are not judged and count neither way. Only completed requests count, so under shedding the alert can clear while requests fail: read llm_d_epp_request_error_total. On this release the analyzer only observes: the fleet the tier sizes misses the SLO; the autoscaler did not fail. First check the target can be met at all (the runbook says how); if it can, raise the floor or lower scaleUpThreshold. Resolves once a judged reading of the last 5 minutes meets the objective; a window excluded while a replica starts does not resolve it."

    # Fires only when there is something to act on: the fleet was excluded for
    # at least half the hour (it never holds still), the router's series are
    # missing for the objective, or TPOT got no requests while the router
    # served streaming requests (clients without include_usage). That last
    # reads the router's own counter, not the TTFT objective, so a policy with
    # a TPOT target alone is covered. Too little traffic -- a quiet model, a
    # diurnal lull -- is not judged and does not fire this.
    # "Set for the hour" is 55 of the hour's minutes, not 60: Prometheus 3
    # ranges are left-open (60 samples, not 61), so 60 failed on any gap in
    # the series, and a restart leaves one of two minutes.
    - alert: WVAModelSLOUnjudged
      expr: (max by (exported_namespace, model_name, objective, statistic) (wva_slo_target_seconds) unless on (exported_namespace, model_name, objective, statistic) max by (exported_namespace, model_name, objective, statistic) (last_over_time(wva_slo_observed_seconds[1h]))) and on (exported_namespace, model_name, objective, statistic) count_over_time(max by (exported_namespace, model_name, objective, statistic) (wva_slo_target_seconds)[1h:1m]) >= 55 and on (exported_namespace, model_name, objective) (avg_over_time(max by (exported_namespace, model_name, objective) (wva_slo_excluded)[1h:1m]) >= 0.5 or (max by (exported_namespace, model_name, objective) (wva_slo_target_seconds) unless on (exported_namespace, model_name, objective) max by (exported_namespace, model_name, objective) (last_over_time(wva_slo_window_requests[1h]))) or (max by (exported_namespace, model_name, objective) (max_over_time(wva_slo_window_requests{objective="tpot"}[1h])) == 0 and on (exported_namespace, model_name) max by (exported_namespace, model_name) (label_replace(label_replace(increase(llm_d_epp_request_ttft_seconds_count{streaming="true"}[1h]), "model_name", "$1", "target_model_name", "(.+)"), "exported_namespace", "$1", "namespace", "(.*)")) > 0)) and on (exported_namespace, model_name) sum by (exported_namespace, model_name) (max_over_time(wva_model_replicas[5m])) > 0
      for: 15m
      labels:
        severity: info
        component: slo
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#a-model-misses-or-is-never-judged-against-its-slo"
        summary: "Model {{ $labels.exported_namespace }}/{{ $labels.model_name }} has had no judged {{ $labels.objective }} window for an hour"
        description: "The model's policy has set a {{ $labels.objective }} target for 55 of the last 60 minutes and the model has replicas, but no window was judged in it, and not for lack of traffic: either the fleet was excluded for at least half of it, never holding still for a window plus its grace (wva_slo_excluded says why), or the router's series for the objective are missing (router not scraped, not in the model's namespace, or clients not streaming), or TPOT saw no requests while the router served streaming requests (clients do not send stream_options.include_usage, or the router does not publish its TPOT series). The runbook has a table of each case."

    - alert: WVAModelParkedWhileRequestsRefused
      expr: ((sum by (exported_namespace, model_name) (wva_model_replicas) == 0) and on (exported_namespace, model_name) label_replace(sum by (namespace, model_name) (rate(llm_d_epp_request_error_total{error_code="ServiceUnavailable",namespace!=""}[5m])) > 0, "exported_namespace", "$1", "namespace", "(.*)")) or ((sum by (exported_namespace, model_name) (wva_model_replicas) == 0) and on (model_name) sum by (model_name) (rate(llm_d_epp_request_error_total{error_code="ServiceUnavailable",namespace=""}[5m])) > 0)
      for: 5m
      labels:
        severity: critical
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#a-model-will-not-wake-from-zero"
        summary: "Model {{ $labels.exported_namespace }}/{{ $labels.model_name }} is at zero replicas while requests are being refused"
        description: "Grouped by exported_namespace, not namespace: Prometheus renames a scraped `namespace` label to `exported_namespace` because the scrape job already carries one, so plain `namespace` here is the CONTROLLER's namespace and would name the wrong place. Nothing is serving this model and EPP is returning ServiceUnavailable for it, so traffic is being dropped and the autoscaler has not brought it back. This alerts on the SYMPTOM, so it fires whatever the cause. Causes: an EPP with no flow-control queue (blocked reason no-wake-signal; WVAModelHasNoWakeSignal stays quiet while this fires, so that cause pages once, here), an EPP that cannot be scraped, KEDA not delivering the activation, an admission or quota refusal on the scale-up, or a bug. Start with wva_model_scaling_blocked for this model — if a reason is present it is the likely cause; wake-no-capacity or wake-nominal-lent-out means a limiter had no room for the wake, and the log line 'Scale-from-zero: no variant woken for a model with pending requests' says what it was measured against. The router exports no namespace of its own, so its series carry the router's namespace as plain namespace, added at scrape time; the join matches that to the model's exported_namespace, so a same-named model refusing requests in another namespace does not page this one. A router series with no namespace label at all (a scrape job that does not add one) is joined on model_name alone, as before."

    - alert: WVAScalerTargetsUndecided
      expr: max by (exported_namespace) (wva_scaler_undecided_targets) > 0
      for: 10m
      labels:
        severity: warning
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#scaledobject-ready-false-or-targets-unknown"
        summary: "{{ $value }} ScaledObject(s) in {{ $labels.exported_namespace }} have had no usable scaling decision for 10 minutes"
        description: "Grouped by exported_namespace, not namespace: the gauge carries the ScaledObject's namespace, which Prometheus renames to exported_namespace because the scrape job already has a namespace label (the controller's). The KEDA external scaler is answering these ScaledObjects with the target's current replica count because no engine has a usable decision for them, so their replica counts are frozen: they neither scale up under load nor down when idle. For a cycle or two after a controller restart or leader change this is expected; ten minutes is not. wva_scaler_undecided_answers_total says why: reason not-managed, or no-decision that never stops, means the model is never planned, usually a trigger metadata value that does not parse; stale means its decision stopped being republished, so read that model's scaling-decision lines. The controller log line 'external scaler has no decision for this target' names each ScaledObject."

    # Kueue cohort borrowing. Only a namespace-scope Kueue quota entry that
    # counts borrowing publishes these series. wva_quota_borrow_withheld
    # carries the model namespace as namespace, which the scrape renames to
    # exported_namespace. test/alerts/testdata/kueue-alerts.test.yaml
    # evaluates them.
    #
    # Stale, in two rules so one failed Kueue read pages once, not once per
    # namespace: a failed read freezes every namespace of the entry, which
    # may be hundreds. WVAKueueReaderStale is per entry, while two or more of
    # its namespaces are stale; WVAKueueReaderStaleNamespace is per namespace,
    # only while it is the entry's only stale one.
    - alert: WVAKueueReaderStale
      expr: count by (limiter_name) (max by (limiter_name, exported_namespace) (wva_quota_borrow_withheld{reason="stale"}) == 1) >= 2
      for: 5m
      labels:
        severity: warning
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#wvakueuereaderstale"
        summary: "Kueue borrowing in {{ $value }} namespaces of quota entry {{ $labels.limiter_name }} has been frozen as stale for 5 minutes"
        description: "Borrowing for these namespaces is frozen at the last figures: nothing new is borrowed and nothing is given back. The entry's last Kueue read failed, or is older than twice the refresh interval. The controller log line 'external quota source unreadable' names the read that failed; usually RBAC or a missing CRD. List the namespaces with: wva_quota_borrow_withheld{reason=\"stale\"}. To hand capacity back by hand meanwhile, lower the borrowing model's maxReplicaCount on its ScaledObject, or set countBorrowable: false on the quota entry, which caps every namespace of the entry at its nominal quota."
    - alert: WVAKueueReaderStaleNamespace
      expr: (max by (limiter_name, exported_namespace) (wva_quota_borrow_withheld{reason="stale"}) == 1) and on (limiter_name) (count by (limiter_name) (max by (limiter_name, exported_namespace) (wva_quota_borrow_withheld{reason="stale"}) == 1) == 1)
      for: 5m
      labels:
        severity: warning
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#wvakueuereaderstale"
        summary: "Kueue borrowing in {{ $labels.exported_namespace }} has been frozen as stale for 5 minutes (quota entry {{ $labels.limiter_name }}, its only stale namespace)"
        description: "Borrowing for this namespace is frozen at the last figures: nothing new is borrowed and nothing is given back. It is the entry's only stale namespace, so either the entry covers this namespace alone and its last Kueue read failed or is older than twice the refresh interval, or this namespace's ResourceQuota read is failing. At the default refresh interval (30s) a failing ResourceQuota read turns into resourcequota-unreadable after five intervals, before this alert fires; it reaches 5 minutes only with a refresh interval above one minute. The controller log line 'external quota source unreadable' names the read that failed; usually RBAC or a missing CRD. To hand capacity back by hand meanwhile, lower the borrowing model's maxReplicaCount on its ScaledObject, or set countBorrowable: false on the quota entry, which caps the namespace at its nominal quota."

    # Kueue reachable, its controller not running: kueue-controller-down.
    # The version gauge below cannot show it: with assumeTestedVersion it
    # reads 1 whatever the Deployment answers.
    - alert: WVAKueueControllerDown
      expr: max by (limiter_name) (wva_quota_borrow_withheld{reason="kueue-controller-down"}) == 1
      for: 5m
      labels:
        severity: warning
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#wvakueuecontrollerdown"
        summary: "Quota entry {{ $labels.limiter_name }}: no running Kueue controller is seen; Kueue borrowing is frozen"
        description: "The scaling manager sees no Kueue leader: the leader-election Lease was not renewed within twice its duration (with no Lease, the kueue-controller-manager Deployment has no ready replica), or the controller cannot read the Deployment or the Lease at all (not found, or Forbidden). Borrowing is frozen: nothing new is borrowed, nothing is given back, nothing borrowed is taken away. Check that Kueue runs (kubectl get deploy kueue-controller-manager -n <kueue namespace>). If it does, check the controller may read the Deployment and the Lease c1f6bfd2.kueue.x-k8s.io there: a namespace-scoped install needs a cluster admin to run KUEUE_NAMESPACE=<kueue namespace> make setup-prereqs. Kueue elsewhere than kueue-system needs kueue.controllerNamespace on the entry. A Kueue built with another leader-election ID reads as down too."

    # The threshold is the cooldown, plus, for a cohort whose pool opts in to
    # releaseToNonReclaimingLenders, how long a release to its lender takes to
    # land (wva_kueue_borrow_release_latency_seconds{cohort}: the KEDA
    # scale-down window and the rest of the models a release there lowers,
    # capped at 30m). The latency is taken off the wait of that cohort's
    # lenders alone; every other cohort -- one whose lenders Kueue reclaims
    # for -- has no latency series and keeps the cooldown alone.
    - alert: WVAKueueLenderWaitingPastCooldown
      expr: (max by (cohort, cluster_queue) (wva_kueue_lender_waiting_seconds) - on (cohort) group_left () max by (cohort) (wva_kueue_borrow_release_latency_seconds) or max by (cohort, cluster_queue) (wva_kueue_lender_waiting_seconds)) > on () group_left () max (wva_kueue_borrow_cooldown_seconds)
      for: 2m
      labels:
        severity: warning
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#wvakueuelenderwaitingpastcooldown"
        summary: "ClusterQueue {{ $labels.cluster_queue }} has waited longer than the borrow cooldown for capacity it lent in cohort {{ $labels.cohort }}"
        description: "A lender has waited longer than the configured borrow cooldown (wva_kueue_borrow_cooldown_seconds), plus, in a cohort whose quota entries set releaseToNonReclaimingLenders, the time a release there takes to land (wva_kueue_borrow_release_latency_seconds for that cohort), while a namespace this controller governs still borrows in its cohort, and Kueue has not preempted for it. By default the scaling manager counts as borrowable only what Kueue would reclaim for its lender (reclaimWithinCohort Any, or LowerPriority above the borrowing model's priority) and stops new borrowing in the cohort while a lender waits; it hands borrowed replicas back itself only with releaseToNonReclaimingLenders on the quota entry (look for 'Releasing borrowed capacity' with cause lender-waiting in the controller log). A wait this long usually means the lender's pending Workload does not outrank the borrowers' (LowerPriority), or the capacity it waits for is held by a borrower this controller does not govern. Check the lender's pending Workload and Kueue's preemption events (kubectl describe workload). To free capacity by hand, lower the borrowing model's maxReplicaCount on its ScaledObject, or set countBorrowable: false on the quota entry."

    # A static -1 cap leaves a type to Kueue alone. Until the first Kueue read
    # succeeds (RBAC missing, CRDs absent, Kueue down at start) nothing bounds
    # that type. Never-read is not fail-closed: the other limiters still bound,
    # and Kueue still gates pods past its quota, so the cost is churn of gated
    # pods, not GPUs over-allocated. This alert says so.
    - alert: WVAKueueNeverRead
      expr: max by (limiter_name) (wva_kueue_never_read) == 1
      for: 10m
      labels:
        severity: warning
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#a-kueue-backed-quota-was-never-read"
        summary: "Quota entry {{ $labels.limiter_name }} reads Kueue but has never read it; a -1 cap leaves its types unbounded"
        description: "The quota entry has kueue.enabled, leaves at least one accelerator type unlimited (-1) in its static caps so that Kueue supplies the figure, and no Kueue read has succeeded since the controller started. Until one does, nothing bounds that type: the scaling manager applies the static entry alone. Check the controller log for 'external quota source unreadable and never read', that the Kueue CRDs are installed, and that the controller may list ClusterQueues, LocalQueues and ResourceFlavors (kubectl auth can-i list clusterqueues.kueue.x-k8s.io --as=system:serviceaccount:<controller-namespace>:<controller-serviceaccount>). To bound the type meanwhile, replace -1 with a number in the entry."

    # The conformance check of the borrowing figures: per ClusterQueue, the
    # borrowed GPUs computed here against Kueue's own figure.
    - alert: WVAKueueBorrowDrift
      expr: max by (cluster_queue) (wva_kueue_borrow_drift_gpus) > 0
      for: 15m
      labels:
        severity: warning
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#wvakueueborrowdrift"
        summary: "ClusterQueue {{ $labels.cluster_queue }}: the borrowed GPUs computed differ from Kueue's by {{ $value }} for 15 minutes"
        description: "For this ClusterQueue, the borrowed GPUs the scaling manager computes (usage past nominal) differ from Kueue's status.flavorsReservation borrowed figure. Borrowing still runs, on figures from a model of Kueue's accounting that no longer matches this cohort, so borrowable may be too high or too low. Brief drift while Kueue admits or preempts is normal; 15 minutes is not. Usual causes: a Kueue feature borrowing does not detect (waitForPodsReady with blockAdmission), or a Kueue release whose accounting changed. If it persists, set countBorrowable: false on the quota entry."

    # wva_kueue_controller_version_known is 1 when the version is read, or
    # when kueue.assumeTestedVersion is set; published only while some entry
    # counts borrowing, so an opted-out cluster never pages. It is also 0 when
    # the Deployment cannot be read, which WVAKueueControllerDown already
    # pages for (kueue-controller-down): the unless keeps one page for one
    # fault, per controller instance.
    - alert: WVAKueueVersionUnknown
      expr: (max by (controller_instance) (wva_kueue_controller_version_known) == 0) unless on (controller_instance) (max by (controller_instance) (wva_quota_borrow_withheld{reason="kueue-controller-down"}) == 1)
      for: 10m
      labels:
        severity: warning
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#wvakueueversionunknown"
        summary: "The scaling manager cannot tell which Kueue release runs; Kueue borrowing is not counted"
        description: "The Kueue controller's Deployment was read and its image names no version (a digest-only reference), or the Deployment could not be read at all. With an image that names no version, borrowing is withheld as kueue-version-unknown: if Kueue runs a tested release, set kueue.assumeTestedVersion: true on the entry, which clears this alert. A Deployment that cannot be read freezes borrowing as kueue-controller-down, which WVAKueueControllerDown reports, so this alert stays quiet while that one's condition holds; assumeTestedVersion does not lift it: a namespace-scoped install needs a cluster admin to run KUEUE_NAMESPACE=<kueue namespace> make setup-prereqs, and Kueue elsewhere than kueue-system needs kueue.controllerNamespace."

    # Informational: a Kueue release outside the tested range. The nominal
    # quota still bounds; only borrowing is withheld, until Kueue is upgraded
    # or downgraded to a tested release.
    - alert: WVAKueueVersionUntested
      expr: max by (limiter_name) (wva_quota_borrow_withheld{reason="kueue-version-untested"}) == 1
      for: 30m
      labels:
        severity: info
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#wvakueueversionuntested"
        summary: "Quota entry {{ $labels.limiter_name }}: Kueue runs a release borrowing is not tested on; borrowing is withheld"
        description: "The Kueue controller runs a release outside the tested range, so the fields and rules borrowing relies on are not known to hold, and borrowing is withheld (kueue-version-untested). Every namespace stays at its nominal quota; nothing is evicted. Run a tested Kueue release (the supported versions table in the quota limiter reference) to count borrowing again."

    - alert: WVAKueuePodsUnplaced
      expr: max by (exported_namespace, variant_name) (wva_kueue_unplaced_pods) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#replicas-dropped-under-kueue-borrowing"
        summary: "{{ $value }} pod(s) of {{ $labels.exported_namespace }}/{{ $labels.variant_name }} unplaced past the placement timeout"
        description: "Grouped by exported_namespace: the series carries the model's namespace. These pods have been Unschedulable, or held at Kueue's admission gate, for longer than the placement timeout (default 5 minutes), and stayed so for 5 more minutes. Borrowed replicas are released at the timeout, so what stays is usually within guaranteed quota: no node fits the pod, Kueue has not admitted it, or the cluster autoscaler is still adding a node. Check 'kubectl describe pod' for the scheduling message and the Workload's admission status."

    # Two counters, because the two ways of losing borrowed capacity are counted
    # apart: the scaling manager's own releases (wva_borrow_releases_total) and
    # Kueue's preemptions (wva_kueue_preempted_pods_total). Both count loss
    # EVENTS of a model -- a P/D pair or a LeaderWorkerSet group is one -- and
    # both are created at 0 on the first cycle that counts borrowing for the
    # model, so the first loss of each kind is an increase. Each side is
    # "(A or B * 0)", so a model with only one kind of loss -- a counter that
    # stopped being published after a restart -- still sums to a value.
    # 3.5, not 3: increase() extrapolates to the edges of the hour, so three
    # losses read as about 3.1, and "> 3" paged on three.
    - alert: WVAKueueBorrowThrashing
      expr: |
        (
          sum by (exported_namespace, model_name) (increase(wva_borrow_releases_total{cause!~"kueue-gate|lender-waiting"}[1h]))
          or
          sum by (exported_namespace, model_name) (increase(wva_kueue_preempted_pods_total[1h])) * 0
        )
        + on (exported_namespace, model_name)
        (
          sum by (exported_namespace, model_name) (increase(wva_kueue_preempted_pods_total[1h]))
          or
          sum by (exported_namespace, model_name) (increase(wva_borrow_releases_total{cause!~"kueue-gate|lender-waiting"}[1h])) * 0
        )
        > 3.5
      for: 1m
      labels:
        severity: warning
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#replicas-dropped-under-kueue-borrowing"
        summary: "Model {{ $labels.exported_namespace }}/{{ $labels.model_name }} lost borrowed capacity more than 3 times in an hour"
        description: "Counts, over the last hour, the times the scaling manager gave borrowed capacity back (wva_borrow_releases_total: after a placement timeout; cause kueue-gate, a replica Kueue held at its gate where no borrowing is counted, is not borrowed capacity and is left out, and so is cause lender-waiting, capacity handed back on purpose to a waiting lender with releaseToNonReclaimingLenders) plus the times Kueue preempted it (wva_kueue_preempted_pods_total). Both count events: one P/D pair, or one LeaderWorkerSet group, lost together is one. With a lender that reclaims (reclaimWithinCohort Any), Kueue's preemptions are the usual cause. The model keeps growing onto capacity its cohort's lenders keep taking back: every cycle costs a cold start. Raise the model's guaranteed quota (nominalQuota), lengthen borrowCooldown, or set countBorrowable: false for it."

    # Load imbalance: one replica of a role saturated while another is idle,
    # read by the controller every cycle (wva_load_imbalanced, which already
    # needs the imbalance to hold for 2 minutes and to read balanced for 2
    # minutes before it drops, by default; loadImbalance.sustainFor and
    # clearAfter in the scaling policy). A routing diagnostic, not a capacity one.
    # max by () so two controller pods, or a restarted one's overlapping
    # series, page once per model and role. keep_firing_for so a dip of the
    # gauge does not resolve the page and raise it again 10 minutes later.
    # test/alerts/testdata/load-imbalance-alerts.test.yaml pins it.
    - alert: WVALoadImbalanced
      expr: max by (exported_namespace, model_name, role) (wva_load_imbalanced) == 1
      for: 10m
      keep_firing_for: 15m
      labels:
        severity: warning
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#one-replica-is-saturated-while-others-idle"
        summary: "Model {{ $labels.exported_namespace }}/{{ $labels.model_name }}: {{ $labels.role }} load is uneven across its replicas"
        description: "For 10 minutes at least one ready {{ $labels.role }} replica has been saturated (KV cache at or over the policy kvCacheThreshold, 80 % by default, or a queue at queueLengthThreshold, except on decode of a model with a prefill variant) while another, Ready for at least 2 minutes, sat idle (KV under 30 %, nothing waiting). The router chose this: the role already has a replica it is not sending work to, so more replicas are unlikely to relieve it. The alert stays firing for 15 minutes after the imbalance clears. The usual cause is the scheduling profile's scorer weights: a prefix-cache-scorer weighted above queue-scorer, active-request-scorer and kv-cache-utilization-scorer sends a request to the replica that saw its prefix however busy it is. wva_load_kv_max_to_mean_ratio and wva_load_queue_max_to_mean_ratio show the spread; the controller log line 'WARNING: load imbalanced' names the busiest and the idle pods."
