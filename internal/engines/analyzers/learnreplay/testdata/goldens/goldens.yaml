# The learner goldens: each fixture is an exported recording and the output
# files its replay produces (docs/developer-guide/testing.md, Learner Goldens).
# Written by make learner-golden-add and make learner-goldens; never by hand.
# The golden check (make test) fails when a golden no longer reproduces, or
# when this list and the directory disagree.
goldens:
- name: acceptance
  outputs:
  - acceptance/learned-state.csv
  - acceptance/lines.csv
  - acceptance/results.csv
  - acceptance/slo-published.csv
  - acceptance/store-records.csv
  - acceptance/variant-capacities.csv
  recording: acceptance/recording.jsonl.gz
  source: 'The in-process acceptance run: three models, a controller restart that
    restores a snapshot, an ITL line published and borrowed, a forget, sweeps that
    evict, P/D decode, slo judging with a router, throughput. It exercises little
    learning: twelve cycles of fixed synthetic rows, so the start-time average, the
    borrow tolerance and the measured k2 and mu paths barely move, and a change to
    them can leave these goldens as they are.'
- name: e1
  notRun:
  - slo
  outputs:
  - e1/learned-state.csv
  - e1/lines.csv
  - e1/results.csv
  - e1/slo-published.csv
  - e1/store-records.csv
  - e1/variant-capacities.csv
  recording: e1/recording.jsonl.gz
  source: E1 benchmark scenario, recorder on, default analyzerTuning
- name: e1-tuned
  notRun:
  - slo
  outputs:
  - e1-tuned/learned-state.csv
  - e1-tuned/lines.csv
  - e1-tuned/results.csv
  - e1-tuned/slo-published.csv
  - e1-tuned/store-records.csv
  - e1-tuned/variant-capacities.csv
  recording: e1-tuned/recording.jsonl.gz
  source: E1 benchmark scenario, recorder on, analyzerTuning steadyFor 3 minutes,
    idle rows 3, idle after ready 3 minutes
- name: engine
  outputs:
  - engine/learned-state.csv
  - engine/lines.csv
  - engine/results.csv
  - engine/slo-published.csv
  - engine/store-records.csv
  - engine/variant-capacities.csv
  - engine/composite-holds.csv
  - engine/composite-release.csv
  - engine/composite-results.csv
  - engine/composite-roles.csv
  - engine/composite-variants.csv
  - engine/warm-pool-pressure.csv
  - engine/warm-pool-supply.csv
  recording: engine/recording.jsonl.gz
  source: 'The in-process engine run: the acceptance scenario with each composite
    recorded, discovery metadata, a bridge lent from the warm pool, an external analyzer
    that fails every third call, a scale target two replicas below its rows, and the
    P/D model under a policy that lists slo alone, so the composite holds both its
    roles. Twelve cycles of synthetic rows. It covers the composite and the warm pool
    figures, not the optimizer.'
- name: mu-paths
  outputs:
  - mu-paths/learned-state.csv
  - mu-paths/lines.csv
  - mu-paths/results.csv
  - mu-paths/slo-published.csv
  - mu-paths/store-records.csv
  - mu-paths/variant-capacities.csv
  recording: mu-paths/recording.jsonl.gz
  source: 'The in-process mu paths run: one decode model of four variants whose replicas
    saturate, so k2 and mu record readings and each of the three mu yields runs, and
    one replica restarts under its own name. Twelve minutes of synthetic rows, recorder
    on, default analyzerTuning.'
