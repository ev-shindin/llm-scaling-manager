    promql_expr_test:
      # kv_cache_usage: the mean of the ranks' peaks, used tokens over capacity (not the busiest rank, 0.875); each rank once, however many copies of its gauge (pid-0: 0.75, not 0.375)
      - expr: 'avg by (model_name, instance, pod) (max by (model_name, instance, pod, engine) (max_over_time(vllm:kv_cache_usage_perc{namespace="llm"}[1m])))'
        eval_time: 10m
        exp_samples:
          - labels: '{model_name="glm",instance="10.0.0.8:8000",pod="dp8-0"}'
            value: 0.203125
          - labels: '{model_name="glm",instance="10.0.1.1:8000",pod="solo-0"}'
            value: 0.5
          - labels: '{model_name="glm",instance="10.0.0.6:8000",pod="pid-0"}'
            value: 0.75
          - labels: '{model_name="glm",instance="10.0.0.2:8000",pod="dup-2"}'
            value: 0.5
      # kv_usage_instant: the same mean, without the window
      - expr: 'avg by (model_name, instance, pod) (max by (model_name, instance, pod, engine) (vllm:kv_cache_usage_perc{namespace="llm"}))'
        eval_time: 10m
        exp_samples:
          - labels: '{model_name="glm",instance="10.0.0.8:8000",pod="dp8-0"}'
            value: 0.203125
          - labels: '{model_name="glm",instance="10.0.1.1:8000",pod="solo-0"}'
            value: 0.5
          - labels: '{model_name="glm",instance="10.0.0.6:8000",pod="pid-0"}'
            value: 0.75
          - labels: '{model_name="glm",instance="10.0.0.2:8000",pod="dup-2"}'
            value: 0.5
      # queue_length: summed over the ranks; a second scrape (solo-0, dup-2) or a pid copy (pid-0) is not counted twice
      - expr: 'sum by (model_name, instance, pod) (max by (model_name, instance, pod, engine) (max_over_time(vllm:num_requests_waiting{namespace="llm"}[1m])))'
        eval_time: 10m
        exp_samples:
          - labels: '{model_name="glm",instance="10.0.0.8:8000",pod="dp8-0"}'
            value: 8
          - labels: '{model_name="glm",instance="10.0.1.1:8000",pod="solo-0"}'
            value: 3
          - labels: '{model_name="glm",instance="10.0.0.6:8000",pod="pid-0"}'
            value: 6
          - labels: '{model_name="glm",instance="10.0.0.2:8000",pod="dup-2"}'
            value: 8
      # max_rank_kv_cache_usage: the busiest rank's cache, which the saturation guards judge
      - expr: 'max by (model_name, instance, pod) (max_over_time(vllm:kv_cache_usage_perc{namespace="llm"}[1m]))'
        eval_time: 10m
        exp_samples:
          - labels: '{model_name="glm",instance="10.0.0.8:8000",pod="dp8-0"}'
            value: 0.875
          - labels: '{model_name="glm",instance="10.0.1.1:8000",pod="solo-0"}'
            value: 0.5
          - labels: '{model_name="glm",instance="10.0.0.6:8000",pod="pid-0"}'
            value: 0.75
          - labels: '{model_name="glm",instance="10.0.0.2:8000",pod="dup-2"}'
            value: 0.75
      # max_rank_queue_length: the busiest rank's queue (dp8-0: rank 7's 6 of the pod's 8)
      - expr: 'max by (model_name, instance, pod) (max_over_time(vllm:num_requests_waiting{namespace="llm"}[1m]))'
        eval_time: 10m
        exp_samples:
          - labels: '{model_name="glm",instance="10.0.0.8:8000",pod="dp8-0"}'
            value: 6
          - labels: '{model_name="glm",instance="10.0.1.1:8000",pod="solo-0"}'
            value: 3
          - labels: '{model_name="glm",instance="10.0.0.6:8000",pod="pid-0"}'
            value: 4
          - labels: '{model_name="glm",instance="10.0.0.2:8000",pod="dup-2"}'
            value: 5
      # cache_config_info: the value counts the ranks; num_gpu_blocks is already the total and is kept as is; a second scrape (solo-0, dup-2) counts no rank twice
      - expr: 'count by (instance, pod, num_gpu_blocks, block_size) (max by (instance, pod, num_gpu_blocks, block_size, engine) (vllm:cache_config_info{namespace="llm"}))'
        eval_time: 10m
        exp_samples:
          - labels: '{instance="10.0.0.8:8000",pod="dp8-0",num_gpu_blocks="80000",block_size="64"}'
            value: 8
          - labels: '{instance="10.0.1.1:8000",pod="solo-0",num_gpu_blocks="10000",block_size="64"}'
            value: 1
          - labels: '{instance="10.0.0.2:8000",pod="dup-2",num_gpu_blocks="2000",block_size="16"}'
            value: 2
      # avg_output_tokens: weighted by each rank's requests; the idle rank adds nothing
      - expr: 'sum by (model_name, instance, pod) (rate(vllm:request_generation_tokens_sum{namespace="llm"}[5m])) / sum by (model_name, instance, pod) (rate(vllm:request_generation_tokens_count{namespace="llm"}[5m]))'
        eval_time: 10m
        exp_samples:
          - labels: '{model_name="glm",instance="10.0.0.8:8000",pod="dp8-0"}'
            value: 896
          - labels: '{model_name="glm",instance="10.0.1.1:8000",pod="solo-0"}'
            value: 512
      # avg_output_tokens_recent
      - expr: 'sum by (model_name, instance, pod) (rate(vllm:request_generation_tokens_sum{namespace="llm"}[1m])) / sum by (model_name, instance, pod) (rate(vllm:request_generation_tokens_count{namespace="llm"}[1m]))'
        eval_time: 10m
        exp_samples:
          - labels: '{model_name="glm",instance="10.0.0.8:8000",pod="dp8-0"}'
            value: 896
          - labels: '{model_name="glm",instance="10.0.1.1:8000",pod="solo-0"}'
            value: 512
      # avg_input_tokens
      - expr: 'sum by (model_name, instance, pod) (rate(vllm:request_prompt_tokens_sum{namespace="llm"}[5m])) / sum by (model_name, instance, pod) (rate(vllm:request_prompt_tokens_count{namespace="llm"}[5m]))'
        eval_time: 10m
        exp_samples:
          - labels: '{model_name="glm",instance="10.0.0.8:8000",pod="dp8-0"}'
            value: 1792
          - labels: '{model_name="glm",instance="10.0.1.1:8000",pod="solo-0"}'
            value: 1024
      # avg_input_tokens_recent
      - expr: 'sum by (model_name, instance, pod) (rate(vllm:request_prompt_tokens_sum{namespace="llm"}[1m])) / sum by (model_name, instance, pod) (rate(vllm:request_prompt_tokens_count{namespace="llm"}[1m]))'
        eval_time: 10m
        exp_samples:
          - labels: '{model_name="glm",instance="10.0.0.8:8000",pod="dp8-0"}'
            value: 1792
          - labels: '{model_name="glm",instance="10.0.1.1:8000",pod="solo-0"}'
            value: 1024
      # prefix_cache_hit_rate: weighted by the tokens each rank looked up
      - expr: 'sum by (model_name, instance, pod) (rate(vllm:prefix_cache_hits_total{namespace="llm"}[5m])) / sum by (model_name, instance, pod) (rate(vllm:prefix_cache_queries_total{namespace="llm"}[5m]))'
        eval_time: 10m
        exp_samples:
          - labels: '{model_name="glm",instance="10.0.0.8:8000",pod="dp8-0"}'
            value: 0.35714285714285715
          - labels: '{model_name="glm",instance="10.0.1.1:8000",pod="solo-0"}'
            value: 0.5
      # avg_itl: weighted by each rank's generated tokens (not the slowest rank, 0.0625); a second scrape doubles both sides and leaves the mean (dup-2)
      - expr: 'sum by (model_name, instance, pod) (rate(vllm:inter_token_latency_seconds_sum{namespace="llm"}[1m])) / sum by (model_name, instance, pod) (rate(vllm:inter_token_latency_seconds_count{namespace="llm"}[1m]))'
        eval_time: 10m
        exp_samples:
          - labels: '{model_name="glm",instance="10.0.0.8:8000",pod="dp8-0"}'
            value: 0.04241071428571429
          - labels: '{model_name="glm",instance="10.0.1.1:8000",pod="solo-0"}'
            value: 0.015625
          - labels: '{model_name="glm",instance="10.0.0.2:8000",pod="dup-2"}'
            value: 0.03125
      # avg_ttft: weighted by each rank's requests
      - expr: 'sum by (model_name, instance, pod) (rate(vllm:time_to_first_token_seconds_sum{namespace="llm"}[1m])) / sum by (model_name, instance, pod) (rate(vllm:time_to_first_token_seconds_count{namespace="llm"}[1m]))'
        eval_time: 10m
        exp_samples:
          - labels: '{model_name="glm",instance="10.0.0.8:8000",pod="dp8-0"}'
            value: 0.4375
          - labels: '{model_name="glm",instance="10.0.1.1:8000",pod="solo-0"}'
            value: 0.25
      # avg_service_time: weighted by each rank's requests
      - expr: 'sum by (model_name, instance, pod) (rate(vllm:request_inference_time_seconds_sum{namespace="llm"}[1m])) / sum by (model_name, instance, pod) (rate(vllm:request_inference_time_seconds_count{namespace="llm"}[1m]))'
        eval_time: 10m
