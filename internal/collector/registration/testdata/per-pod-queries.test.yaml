# promtool unit test for the per-pod vLLM queries the collector registers
# (internal/collector/registration). hack/check-collector-queries.sh runs
# promtool test rules on it; TestPerPodQueriesMatchPromtoolFixture keeps every
# expr below identical to the query the registry builds for namespace "llm".
#
# dp8-0 is one pod running eight data-parallel ranks behind ONE vLLM API
# server: every series once per rank, told apart only by the engine label, as
# vllm/v1/metrics/loggers.py exports them. Its cache_config_info repeats once
# per rank with the SAME num_gpu_blocks, the API server's sum over its engines
# (80000 = 8 x 10000). Rank 7 is hot: twice the requests, four times the
# output, the busiest cache (0.875) and the slowest tokens. Rank 5 is idle.
#
# solo-0 is an ordinary pod with one rank. Every query returns for it exactly
# what the max-based queries before issue #150 returned, including when the
# target is scraped twice.
#
# pid-0 is a pod of two ranks behind an older vLLM run with
# --api-server-count 2, whose gauges are exported once per API server process
# (a pid label); the process that did not receive a rank's stats holds 0.
# dup-2 is a pod of two ranks whose target is scraped twice (job a and b).
# Neither may count a rank twice.
#
# Each expected value is the rank figures combined by hand: the plain mean for
# utilization, the sum for the queue, the count for the ranks, the max for the
# busiest rank's queue and cache, and for every mean its sum over the ranks
# divided by its count over the ranks. Each is exact in binary or a correctly
# rounded quotient, so promtool compares them exactly. Under the max-based
# queries before issue #150 every dp8-0 sample of the mean, sum and count
# queries fails and every solo-0 sample passes.
rule_files: []
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'vllm:kv_cache_usage_perc{namespace="llm",pod="dp8-0",instance="10.0.0.8:8000",engine="0",model_name="glm"}'
        values: '0.125x15'
      - series: 'vllm:num_requests_waiting{namespace="llm",pod="dp8-0",instance="10.0.0.8:8000",engine="0",model_name="glm"}'
        values: '0x15'
      - series: 'vllm:cache_config_info{namespace="llm",pod="dp8-0",instance="10.0.0.8:8000",engine="0",num_gpu_blocks="80000",block_size="64",cache_dtype="auto"}'
        values: '1x15'
      - series: 'vllm:request_generation_tokens_count{namespace="llm",pod="dp8-0",instance="10.0.0.8:8000",engine="0",model_name="glm"}'
        values: '0+60x15'
      - series: 'vllm:request_generation_tokens_sum{namespace="llm",pod="dp8-0",instance="10.0.0.8:8000",engine="0",model_name="glm"}'
        values: '0+30720x15'
      - series: 'vllm:request_prompt_tokens_count{namespace="llm",pod="dp8-0",instance="10.0.0.8:8000",engine="0",model_name="glm"}'
        values: '0+60x15'
      - series: 'vllm:request_prompt_tokens_sum{namespace="llm",pod="dp8-0",instance="10.0.0.8:8000",engine="0",model_name="glm"}'
        values: '0+61440x15'
      - series: 'vllm:prefix_cache_queries_total{namespace="llm",pod="dp8-0",instance="10.0.0.8:8000",engine="0",model_name="glm"}'
        values: '0+61440x15'
