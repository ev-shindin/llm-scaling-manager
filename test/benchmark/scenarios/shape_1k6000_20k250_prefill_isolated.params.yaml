# Prefill saturated while decode is NOT -- the condition the analyzer requires
# before it will learn a prefill k2, and the one neither earlier attempt met.
#
# Why the earlier attempts failed. The 14k/1000 @12rps trace delivered 169,909
# input tok/s and prefill did not queue on its own account at all. When it
# eventually did queue -- 41 waiting, 707,791 tokens of KV held, all of them
# reason="capacity" -- the queue tracked DECODE's replica count and nothing
# else: it grew as decode sat at 4-6 and drained the moment decode reached 7-8,
# with the prompt rate constant throughout. The analyzer discards exactly that
# reading, and says so:
#
#   "queue saturated while the decode role is; a prefill completes only when
#    decode admits it, so this is decode's saturation seen from prefill;
#    not recorded"
#
# So k2Source stayed P4-k1 across all 89 prefill decisions and the floor priced
# ["decode"] throughout. Raising the RATE cannot fix this, because rate drives
# both roles: the 14k/500 @24rps follow-up (committed as
# shape_swap_replay_1k6000_14k500_prefill_2x, deliberately NOT run) works out at
# 60 sequences in flight against 52 of decode KV -- decode-bound before prefill
# is stressed.
#
# Prompt LENGTH is the lever that separates them. It raises prefill work per
# request while leaving decode's token rate alone, and here the output is cut to
# 250 so decode's load actually falls:
#
#   prefill   30,000 x 12 = 360,000 input tok/s   (2.1x the 169,909 measured)
#   decode        250 x 12 =   3,000 output tok/s  (was 12,000)
#
# Decode KV, the constraint that sank the rate approach, computed against the
# measured k1 of 930,508 and kvCacheThreshold 0.80 -- 744,406 usable:
#
#   KVreq        = 30,000 + 250/2       = 30,125 tokens per sequence
#   max sequences = 744,406 / 30,125    = 24.7
#   in flight     = 12 rps x (250 x 5ms) = 15.0
#
# 15 against 24.7 leaves decode at about 61% occupancy -- below the 0.70
# scale-down boundary, so decode should shrink rather than saturate, which is
# the entire point.
#
# REQUIRES VLLM_MAX_MODEL_LEN >= 30,250 on both roles; the fleet ships 16,384.
# Qwen3-0.6B supports 32,768 natively and VLLM_ALLOW_LONG_MAX_MODEL_LEN=1 is
# already set, so this is a deployment env change, not a model limit.

seed: 42
arrival_distribution: poisson
length_distribution: constant   # min=max per phase -- fixed lengths, no spread

output:
  path: shape_1k6000_20k250_prefill_isolated.jsonl
  timestamp_column: timestamp
  prompt_tokens_column: input_length
  output_tokens_column: output_length

phases:
  - name: 1k6000-rps6
    duration_s: 300
    rate_rps: 6
    input_tokens:  { mean: 1000 }
    output_tokens: { mean: 6000 }

  - name: 20k250-rps12
    duration_s: 600
    rate_rps: 12
    input_tokens:  { mean: 20000 }
    output_tokens: { mean: 250 }
